<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fantasy">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Armchair Hockey · Weekly Lineup</title>
<style>
:root{
  --bg:#0a0f16; --bg2:#0f1620; --panel:#131b26; --panel2:#19232f; --line:#223041; --line2:#2d3d51;
  --tx:#e9f0f7; --dim:#8d9aab; --dimmer:#5d6a7b;
  --acc:#5cc8ff; --accdim:#123a52; --good:#3fcf8e; --warn:#f0b43c; --bad:#ff5d5d;
  --f:#b48cff; --d:#f59e5b; --g:#ff6f91;
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--tx);overscroll-behavior-y:none}
body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;
  padding:calc(var(--safeT) + 8px) 12px calc(var(--safeB) + 24px);max-width:760px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-appearance:none;background:none;border:none;cursor:pointer;user-select:none}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.puck{width:22px;height:22px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#3a4656,#0b0f14 70%);box-shadow:0 0 0 2px var(--acc) inset}
.top b{font-size:13px;color:var(--dim);font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:10.5px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--dim);white-space:nowrap;margin-left:auto;font-weight:600}
.pill.on{color:#7ee0ad;border-color:#1c4a35;background:#0d2a1d} .pill.warn{color:#ffd894;border-color:#5a4415;background:#2a1f08}
.ic{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:15px;flex:none}
.week{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.week .nav{width:38px;height:38px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:17px;color:var(--acc);font-weight:800}
.week .mid{flex:1;text-align:center}
.week .mid i{display:block;font-style:normal;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dimmer)}
.week .mid b{font-size:16px}
.days{display:grid;gap:4px;margin:8px 0 10px}
.day{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 0;text-align:center}
.day i{display:block;font-style:normal;font-size:9.5px;color:var(--dimmer);font-weight:700;letter-spacing:.05em}
.day b{font-size:13px}
.day.light b{color:var(--good)} .day.heavy b{color:var(--warn)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:10px}
.card>h2{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.085em;color:var(--dim);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel2);display:flex;gap:8px;align-items:center;font-weight:650}
.card>h2 em{font-style:normal;font-size:10.5px;color:var(--dimmer);text-transform:none;letter-spacing:0;margin-left:auto;font-weight:450;text-align:right}
.pad{padding:11px 12px}
.note{font-size:12.5px;color:var(--dim);line-height:1.55} .note b{color:var(--tx)}
.sub{color:var(--dimmer);font-size:11px}
.up{color:var(--good)} .down{color:var(--bad)} .wn{color:var(--warn)}
.hero{padding:13px;background:radial-gradient(120% 100% at 0% 0%,rgba(92,200,255,.14),transparent 62%),var(--panel)}
.hero .big{font-size:30px;font-weight:800;letter-spacing:-.02em}
.hero .lbl{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);font-weight:750}
.grp{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dimmer);font-weight:750;padding:8px 12px 4px;border-top:1px solid #1a2431}
.row{display:flex;align-items:center;gap:9px;padding:8px 12px;border-top:1px solid #1a2431;cursor:pointer}
.row .body{flex:1;min-width:0}
.row .t{display:block;font-size:14px;font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{display:block;font-size:11px;color:var(--dimmer);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .gm{flex:none;text-align:center;min-width:34px}
.row .gm b{display:block;font-size:19px;font-weight:800;line-height:1}
.row .gm i{font-style:normal;font-size:9px;color:var(--dimmer);letter-spacing:.06em}
.row .dl{flex:none;text-align:right;min-width:62px;font-size:12px}
.row.close{background:linear-gradient(90deg,rgba(240,180,60,.10),transparent 70%)}
.row.out{opacity:.5}
.dots{display:flex;gap:3px;margin-top:4px}
.dot{width:12px;height:12px;border-radius:3px;background:var(--bg);border:1px solid var(--line)}
.dot.on{background:var(--acc);border-color:var(--acc)} .dot.b2b{background:var(--warn);border-color:var(--warn)}
.dot.half{background:linear-gradient(90deg,var(--acc) 50%,var(--bg) 50%);border-color:var(--acc)}
.pos{display:inline-block;min-width:22px;text-align:center;font-size:10px;font-weight:800;padding:2px 5px;border-radius:5px;margin-right:4px;vertical-align:1px}
.F{background:rgba(180,140,255,.17);color:var(--f)} .D{background:rgba(245,158,91,.17);color:var(--d)} .G{background:rgba(255,111,145,.17);color:var(--g)}
.tag{font-size:10px;font-weight:750;padding:1px 6px;border-radius:5px;margin-left:5px;vertical-align:1px}
.tag.bad{background:#3a1515;color:#ffadad} .tag.wn{background:#3a2a0c;color:#ffd894} .tag.new{background:#0d2536;color:#bfe9ff}
.cats .cr{display:grid;grid-template-columns:auto 1fr 46px;gap:8px;align-items:center;padding:5px 0}
.cats .cn{min-width:92px;display:flex;align-items:center;gap:6px}
.emph{font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;border:1px solid var(--line2);color:var(--dimmer);min-width:44px}
.emph.push{color:#04131d;background:var(--acc);border-color:var(--acc)} .emph.punt{color:#ffadad;border-color:#4a2424;background:#2a1010}
.track{height:9px;border-radius:5px;background:var(--bg);border:1px solid var(--line);position:relative;overflow:hidden}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.track .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line2)}
.btn{padding:9px 12px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);font-size:13px;font-weight:650;color:var(--dim)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#04131d}
.btn:active,.row:active{transform:scale(.99)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.segctl{display:flex;background:var(--panel);border:1px solid var(--line2);border-radius:11px;padding:3px;gap:3px}
.segctl button{flex:1;padding:8px 6px;border-radius:8px;font-weight:700;font-size:12.5px;color:var(--dim)}
.segctl button.on{background:var(--acc);color:#04131d}
textarea{width:100%;min-height:110px;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:8px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:50%;bottom:0;width:min(760px,100%);transform:translate(-50%,105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);z-index:50;
  max-height:88%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg2);border-top:1px solid var(--line2);border-radius:18px 18px 0 0;padding:8px 14px calc(var(--safeB) + 18px)}
#sheet{visibility:hidden}
#sheet.on{transform:translate(-50%,0);visibility:visible}
#sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line2);margin:4px auto 10px}
#sheet h3{margin:0;font-size:17px}
.sgroup{margin:14px 0 6px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dimmer);font-weight:750}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #1a2431;font-size:13.5px}
.stepper{display:flex;align-items:center;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.stepper button{width:36px;height:32px;font-size:17px;font-weight:700;color:var(--acc);background:var(--panel)}
.stepper span{min-width:40px;text-align:center;font-weight:750}
.tog{padding:7px 10px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);font-size:12.5px;font-weight:700;color:var(--dim)}
.tog.on{border-color:var(--acc);background:#0d2536;color:#cdeeff}
#toast{position:fixed;left:50%;top:calc(var(--safeT) + 10px);transform:translate(-50%,-20px);opacity:0;pointer-events:none;background:#1f2c3b;border:1px solid var(--line2);
  border-radius:14px;padding:10px 14px;font-size:13px;transition:all .2s;z-index:60;max-width:calc(100% - 24px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="top"><span class="puck"></span><b id="title">Weekly lineup</b>
  <span class="pill" id="live">projections</span>
  <button class="ic" id="refresh" title="Refresh live stats and injuries">↻</button>
  <button class="ic" id="gear" title="Settings">⚙️</button>
  <button class="ic" id="tools" title="Your other tools">☰</button></div>

<div class="week"><button class="nav" id="prev" aria-label="Previous week">‹</button>
  <div class="mid"><i>Lineup locks Monday for</i><b id="wk">—</b></div>
  <button class="nav" id="next" aria-label="Next week">›</button></div>
<div class="days" id="days"></div>

<div class="card"><div class="hero" id="hero"></div></div>

<div class="card"><h2>Start these <em id="startmeta"></em></h2><div id="starters"></div></div>
<div class="card"><h2>Bench <em>what it would cost to swap in</em></h2><div id="bench"></div></div>
<div class="card"><h2>Category outlook <em id="catmeta"></em></h2><div class="pad">
  <div class="segctl" id="vsctl"><button data-vs="typical">vs typical team</button><button data-vs="opp">vs this week's opponent</button></div>
  <div class="cats" id="cats" style="margin-top:10px"></div>
  <div class="note" style="margin-top:8px">Tap a category to push it (counts 1.5×) or punt it (ignored). The lineup re-optimizes right away.</div></div></div>
<div class="card"><h2>Roster</h2><div class="pad">
  <div class="note" id="rosternote"></div>
  <div class="chips" style="margin-top:8px"><button class="btn pri" id="pasteme">Update my roster</button><button class="btn" id="pasteopp">Add this week's opponent</button></div></div></div>
<div class="card"><h2>Method</h2><div class="pad note" id="method"></div></div>

<div id="scrim"></div>
<div id="sheet"><div class="grab"></div><div style="display:flex;align-items:center"><h3 id="stitle">Settings</h3><button class="btn pri" id="sdone" style="margin-left:auto">Done</button></div><div id="sbody"></div></div>
<div id="toast"></div>

/* ---------------- per-game rates: projection blended with season + last 15 days ---------------- */

/* ---------------- the "typical team" a matchup is played against ---------------- */

    const col=p>0.6?'var(--good)':p<0.4?'var(--bad)':'var(--warn)';
    const fmt=v=>k==='svp'?v.toFixed(3).replace(/^0/,''):k==='gaa'?v.toFixed(2):v.toFixed(1);
    return `<div class="cr"><span class="cn"><button class="emph ${e}" data-emph="${k}">${e==='push'?'PUSH':e==='punt'?'PUNT':CAT[k].l}</button><span class="sub">${fmt(me[k].mu)} vs ${fmt(op[k].mu)}</span></span>
      <div class="track"><div class="mid"></div><div class="fill" style="width:${(p*100).toFixed(0)}%;background:${col}"></div></div><b style="text-align:right;color:${col}">${Math.round(p*100)}%</b></div>`; }).join('');
  $('#catmeta').textContent=`win chance per category`;
  $('#cats').querySelectorAll('[data-emph]').forEach(b=>b.onclick=()=>{ const k=b.dataset.emph, c=S.st.emph[k]; S.st.emph[k]=!c||c==='normal'?'push':c==='push'?'punt':'normal'; save(); render(); });
  $('#vsctl').querySelectorAll('button').forEach(b=>{ b.classList.toggle('on',b.dataset.vs===S.st.vs); b.onclick=()=>{ if(b.dataset.vs==='opp'&&!(S.opp&&S.opp.players.length)){ openPaste('opp'); return; } S.st.vs=b.dataset.vs; save(); render(); }; });
  // roster note
  const unmatched=S.roster.players.filter(x=>!x.p).map(x=>x.name);
  $('#rosternote').innerHTML=`<b>${S.roster.players.length} players</b> from your Yahoo paste. Slots: ${Object.entries(S.roster.slots).map(([k,v])=>`${v} ${k}`).join(' · ')}. Scored: ${skCats().map(k=>CAT[k].l).join(', ')} / ${gCats().map(k=>CAT[k].l).join(', ')}.`
    +(unmatched.length?` <span class="wn">No projection for ${unmatched.map(esc).join(', ')}; they get a depth-player estimate.</span>`:'')
    +(S.opp&&S.opp.players.length?`<br>Opponent loaded: ${S.opp.players.length} players.`:'');
  // live pill
  const lp=$('#live');
  if(S.live&&S.live.ts){ const h=(Date.now()-S.live.ts)/36e5; lp.textContent=h<1?'live · just now':h<24?`live · ${Math.round(h)}h ago`:`live · ${Math.round(h/24)}d ago`; lp.className='pill '+(h<24?'on':'warn'); }
  else { lp.textContent='projections only'; lp.className='pill warn'; }
  document.querySelectorAll('.row[data-k]').forEach(el=>el.onclick=()=>openPlayer(el.dataset.k));
  renderMethod();
}
function oppTotals(){
  // their likely Monday lineup: the same optimizer, run on their roster against a typical team
  const typ=typicalTeam(); const r=optimize(S.opp,typ);
  return {sk:r.skTot,g:r.gTot};
}
function renderMethod(){
  $('#method').innerHTML=`<p><b>What it optimizes:</b> your chance of winning each category this week, added up. Each player brings his per-game rate times the games his team plays from Monday to Sunday, so a 4-game player usually beats a 2-game star, but not always. Every possible legal lineup is checked, not just the top names.</p>
  <p><b>Per-game rates</b> start from the preseason projection (ESPN's 2026-27 numbers blended with three seasons of NHL data) and move toward what he's actually doing this season, with the last 15 days counted extra. Goals and plus/minus move slowly because they're streaky; hits and blocks move fast because they're real habits. Settings has a projection-only mode and a "hot hand" mode.</p>
  <p><b>Goalies</b> count starts, not team games: his share of starts so far, and a starter rarely plays both nights of a back-to-back (orange squares). SV% and GAA are judged on the whole week's workload.</p>
  <p><b>Injuries</b> come from the live feed when you refresh, or from the status in your Yahoo paste. Out, IR and minors mean zero games; day-to-day counts 80%. Tap any player to set his games yourself.</p>
  <p><b>Can't do yet:</b> read your Yahoo roster or opponent directly (that needs the API), or know about late scratches and goalie confirmations. Schedule is the NHL's 2026-27 calendar as of the build.</p>
  <p class="sub">Build ${esc(BUILD)}. Stats and injuries: ESPN public fantasy feed. Schedule: NHL.</p>`;
}

/* ---------------- sheets ---------------- */
function openSheet(title,html,wire){ $('#stitle').textContent=title; $('#sbody').innerHTML=html; if(wire) wire(); $('#sheet').classList.add('on'); $('#scrim').classList.add('on'); }
function closeSheet(){ $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); }
function openPaste(which){
  const isOpp=which==='opp';
  openSheet(isOpp?"This week's opponent":'Update my roster',`
    <div class="note" style="margin-top:8px">${isOpp?"On Yahoo, open your opponent's team page, select the whole roster from the first skater down through the goalies, copy, and paste here. Their likely lineup is worked out the same way as yours.":'On Yahoo, open My Team, select the roster from the first skater down through the goalies, copy, and paste here. Do it after any adds or drops.'}</div>
    <textarea id="ptxt" style="margin-top:10px;min-height:150px" placeholder="Paste the Yahoo roster here">${isOpp?esc(S.st.oppText||''):''}</textarea>
    <div class="note" id="pprev" style="margin-top:8px"></div>
    <div class="chips" style="margin-top:10px"><button class="btn pri" id="pgo">Use this roster</button>${isOpp&&S.st.oppText?'<button class="btn" id="pclear">Remove opponent</button>':''}</div>`,()=>{
    const prev=()=>{ const r=buildRoster($('#ptxt').value); const miss=r.players.filter(x=>!x.p).length;
      $('#pprev').innerHTML=r.players.length?`Found <b>${r.players.length}</b> players (${['F','D','G'].map(g=>`${r.players.filter(x=>x.grp===g).length} ${g}`).join(', ')})${miss?`, ${miss} without a projection`:''}.`:'<span class="sub">Nothing recognized yet.</span>'; };
    $('#ptxt').addEventListener('input',prev); prev();
    $('#pgo').onclick=()=>{ const t=$('#ptxt').value; const r=buildRoster(t); if(!r.players.length){ toast('No players found in that text'); return; }
      if(isOpp){ S.st.oppText=t; S.opp=r; S.st.vs='opp'; } else { S.st.rosterText=t; S.roster=r; if(r.cats.sk.length&&r.cats.g.length) S.st.cats=r.cats; }
      save(); closeSheet(); refreshLive(true); render(); toast(isOpp?'Opponent loaded':'Roster updated'); };
    const c=$('#pclear'); if(c) c.onclick=()=>{ S.st.oppText=''; S.opp=null; S.st.vs='typical'; save(); closeSheet(); render(); };
  });
}
function openPlayer(key){
  const x=[...S.roster.players,...(S.opp?S.opp.players:[])].find(y=>y.key===key)||S.roster.players.find(y=>y.key===key); if(!x) return;
  const o=S.st.ovr[key]||{}, gmax=x.c.games.length;
  const lv=liveFor(x.p);
  const live=lv?`Season: ${+lv.season['30']||0} GP`+(x.grp==='G'?`, ${+lv.season['0']||0} GS`:`, ${+lv.season['13']||0} G, ${+lv.season['14']||0} A, ${+lv.season['31']||0} HIT, ${+lv.season['32']||0} BLK`)+`. ESPN status: ${esc((lv.inj||'ACTIVE').replace('_',' ').toLowerCase())}.`:'No live stats loaded yet.';
  openSheet(x.name,`
    <div class="note" style="margin-top:6px">${esc(x.team)} · ${x.grp} · ${gmax} team game${gmax===1?'':'s'} this week${x.c.games.length?': '+x.c.games.map(g=>`${DOW[new Date(g[0]+'T12:00:00Z').getUTCDay()]} ${g[2]?'vs':'@'} ${g[1]}`).join(', '):''}.<br>${live}</div>
    <div class="sgroup">Games he'll play this week</div>
    <div class="chips"><button class="tog ${o.games==null?'on':''}" data-g="auto">Auto</button>${Array.from({length:gmax+1},(_,i)=>`<button class="tog ${o.games===i?'on':''}" data-g="${i}">${i}</button>`).join('')}</div>
    ${x.grp==='G'?`<div class="sgroup">Share of starts</div><div class="chips">${[['auto','Auto'],[0.72,'Starter'],[0.55,'1A'],[0.45,'Split'],[0.3,'Backup']].map(([v,l])=>`<button class="tog ${(o.share==null&&v==='auto')||o.share===v?'on':''}" data-sh="${v}">${l}</button>`).join('')}</div>`:''}
    <div class="sgroup">Lineup</div>
    <div class="chips"><button class="tog ${o.include==null?'on':''}" data-inc="auto">Auto</button><button class="tog ${o.include===true?'on':''}" data-inc="yes">Always consider</button><button class="tog ${o.include===false?'on':''}" data-inc="no">Never start</button></div>`,()=>{
    const set=(k,v)=>{ const cur=Object.assign({},S.st.ovr[key]||{}); if(v==null) delete cur[k]; else cur[k]=v; S.st.ovr[key]=cur; save(); render(); openPlayer(key); };
    $('#sbody').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>set('games',b.dataset.g==='auto'?null:+b.dataset.g));
    $('#sbody').querySelectorAll('[data-sh]').forEach(b=>b.onclick=()=>set('share',b.dataset.sh==='auto'?null:+b.dataset.sh));
    $('#sbody').querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>set('include',b.dataset.inc==='auto'?null:b.dataset.inc==='yes'));
  });
}
function openSettings(){
  const st=S.st;
  const stp=(id,v)=>`<div class="stepper" data-st="${id}"><button data-d="-1">−</button><span>${v}</span><button data-d="1">+</button></div>`;
  openSheet('Settings',`
    <div class="sgroup">Recent form</div>
    <div class="segctl" id="trendctl">${[['proj','Projection only'],['bal','Balanced'],['hot','Hot hand']].map(([v,l])=>`<button data-tr="${v}" class="${st.trend===v?'on':''}">${l}</button>`).join('')}</div>
    <div class="sgroup">Week</div>
    <div class="srow"><span>Days in this scoring week <span class="sub">(the first week of a season can run long)</span></span>${stp('days',st.days)}</div>
    <div class="srow"><span>Teams in your league <span class="sub">(sets the "typical team")</span></span>${stp('teams',st.teams)}</div>
    <div class="sgroup">Scored categories</div>
    <div class="chips">${Object.keys(CAT).map(k=>`<button class="tog ${[...st.cats.sk,...st.cats.g].includes(k)?'on':''}" data-cat="${k}">${CAT[k].l}</button>`).join('')}</div>
    <div class="sgroup">Reset</div>
    <div class="chips"><button class="btn" id="clrovr">Clear my player overrides</button><button class="btn" id="clremph">Clear push / punt</button></div>`,()=>{
    $('#trendctl').querySelectorAll('button').forEach(b=>b.onclick=()=>{ st.trend=b.dataset.tr; save(); render(); openSettings(); });
    $('#sbody').querySelectorAll('.stepper').forEach(s=>s.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const id=s.dataset.st, d=+b.dataset.d;
      if(id==='days') st.days=clamp(st.days+d,1,21); else st.teams=clamp(st.teams+d,6,20); save(); render(); openSettings(); }));
    $('#sbody').querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{ const k=b.dataset.cat, arr=st.cats[CAT[k].g], i=arr.indexOf(k);
      if(i>=0){ if(arr.length===1){ toast('Keep at least one'); return; } arr.splice(i,1); } else arr.push(k); save(); render(); openSettings(); });
    $('#clrovr').onclick=()=>{ st.ovr={}; save(); render(); toast('Overrides cleared'); };
    $('#clremph').onclick=()=>{ st.emph={}; save(); render(); toast('Push and punt cleared'); };
  });
}
let tt=null; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),2200); }

/* ---------------- boot ---------------- */
function boot(){
  load();
  if(!S.st.week) S.st.week=defaultMonday();
  S.roster=buildRoster(S.st.rosterText);
  if(!S.st.cats){ const c=S.roster.cats; S.st.cats=(c.sk.length&&c.g.length)?c:null; }
  if(S.st.oppText) S.opp=buildRoster(S.st.oppText);
  $('#prev').onclick=()=>{ S.st.week=addDays(S.st.week,-7); save(); render(); };
  $('#next').onclick=()=>{ S.st.week=addDays(S.st.week,7); save(); render(); };
  $('#wk').parentElement.onclick=()=>{ S.st.week=defaultMonday(); save(); render(); };
  $('#tools').onclick=()=>openSheet('Your tools',`
    <div class="note" style="margin-top:6px">The draft boards are shelved for the season but one tap away. Each has a button to come back here.</div>
    <div style="display:grid;gap:8px;margin-top:12px">
      <a class="btn pri" style="text-decoration:none;text-align:left;padding:14px" href="./"><b>🏒 Weekly lineup</b><br><span style="font-weight:500">Yahoo hockey, set every Monday · you're here</span></a>
      <a class="btn" style="text-decoration:none;text-align:left;padding:14px;color:var(--tx)" href="../nhl/"><b>🥅 Hockey draft board</b><br><span class="sub">Yahoo hockey, 2026-27 draft</span></a>
      <a class="btn" style="text-decoration:none;text-align:left;padding:14px;color:var(--tx)" href="../"><b>🏈 Football draft board</b><br><span class="sub">Sleeper, Armchair Quarterbacks</span></a>
    </div>`);
  $('#gear').onclick=openSettings; $('#sdone').onclick=closeSheet; $('#scrim').onclick=closeSheet;
  $('#refresh').onclick=()=>refreshLive(false);
  $('#pasteme').onclick=()=>openPaste('me'); $('#pasteopp').onclick=()=>openPaste('opp');
  render();
  if(!S.live||Date.now()-S.live.ts>6*36e5) refreshLive(true);
  if('serviceWorker' in navigator&&(location.protocol==='https:'||['localhost','127.0.0.1'].includes(location.hostname))) navigator.serviceWorker.register('sw.js').catch(()=>{});
}
boot();
</script>
